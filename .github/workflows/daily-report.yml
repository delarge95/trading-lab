name: daily-report

# Las ejecuciones programadas de GitHub se retrasan o se pierden en horas de carga. Por eso hay tres franjas por día:
# si una ya generó el informe de hoy (UTC), las siguientes se saltan solas (job `check`).
# Lun-Vie 08:25, 09:25 y 10:10 UTC (3:25, 4:25 y 5:10 a. m. Bogotá); sábados 09:40, 10:40 y 11:40 UTC.
# Las tareas de informe leen el repo a las 6:37 a. m. (lun-vie) y 8:35 a. m. (sáb) hora de Bogotá.
on:
  schedule:
    - cron: "25 8 * * 1-5"
    - cron: "25 9 * * 1-5"
    - cron: "10 10 * * 1-5"
    - cron: "40 9 * * 6"
    - cron: "40 10 * * 6"
    - cron: "40 11 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: c
        run: |
          today=$(date -u +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "reports/${today}.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Ya existe reports/${today}.md: se omite esta franja."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  report:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      # Caché de descargas SEC: la primera corrida tarda ~15 min, las siguientes ~1 min
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Tests
        run: python -m pytest tests -q

      - name: Generate report
        env:
          # La SEC exige un contacto. Definir el secreto SEC_USER_AGENT en Settings > Secrets > Actions.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python run_daily.py

      - name: Commit report
        run: |
          git config user.name "trading-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports docs/data data/predictions.csv data/managers_track.json data/cusip_map.json data/picks_ledger.json data/forecast_history.json data/fundamentals_eval.json data/alt
          git diff --cached --quiet || git commit -m "report: $(date -u +%Y-%m-%d)"
          git pull -q --rebase
          git push
