name: daily-report

# Lun-Vie 10:10 UTC (5:10 a. m. Bogotá) y sábados 11:40 UTC (6:40 a. m. Bogotá), antes de las tareas de informe.
on:
  schedule:
    - cron: "10 10 * * 1-5"
    - cron: "40 11 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      # Caché de descargas SEC: la primera corrida tarda ~15 min, las siguientes ~1 min
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Tests
        run: python -m pytest tests -q

      - name: Generate report
        env:
          # La SEC exige un contacto. Definir el secreto SEC_USER_AGENT en Settings > Secrets > Actions.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python run_daily.py

      - name: Commit report
        run: |
          git config user.name "trading-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/predictions.csv
          git diff --cached --quiet || git commit -m "report: $(date -u +%Y-%m-%d)"
          git push
